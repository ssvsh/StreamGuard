spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: contracts
          uri: http://localhost:8081
          predicates:
            - Path=/api/contracts/**
        - id: violations
          uri: http://localhost:8082
          predicates:
            - Path=/api/violations/**
        - id: quality
          uri: http://localhost:8082
          predicates:
            - Path=/api/quality/**
        - id: recommendations
          uri: http://localhost:8083
          predicates:
            - Path=/api/recommendations/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway